name: Deploy Frontend (Square Cloud)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build e commit na Square Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      # As variaveis VITE_* precisam existir no momento do build:
      # o Vite as inlina no bundle. Configure-as como secrets do repositorio.
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SPOTIFY_REDIRECT_URI: ${{ secrets.VITE_SPOTIFY_REDIRECT_URI }}
        run: npm run build

      # O app estatico recebe apenas o resultado do build.
      # O squarecloud.app vai para a raiz do zip, ao lado do index.html.
      - name: Empacotar
        run: |
          cp frontend/squarecloud.app frontend/dist/squarecloud.app
          cd frontend/dist
          zip -r ../../frontend.zip .

      - name: Deploy na Square Cloud
        uses: squarecloudofc/github-action@v2
        with:
          command: commit --file frontend.zip ${{ secrets.SQUARE_FRONTEND_APP_ID }} --restart
          token: ${{ secrets.SQUARE_TOKEN }}

      - name: Resumo
        run: echo "Frontend enviado para a Square Cloud (app ${{ secrets.SQUARE_FRONTEND_APP_ID }})." >> $GITHUB_STEP_SUMMARY
