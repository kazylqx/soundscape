name: Deploy Backend (Square Cloud)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  # Permite disparar na mao pela aba Actions (util depois de criar os secrets).
  workflow_dispatch:

concurrency:
  group: deploy-backend
  # false de proposito: cancelar um deploy no meio do upload pode deixar a
  # aplicacao com arquivos pela metade.
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e commit na Square Cloud
    runs-on: ubuntu-latest

    steps:
      # Roda antes de tudo: sem os secrets o passo de deploy falharia com um
      # erro obscuro do CLI, difícil de associar a configuracao faltando.
      - name: Conferir secrets
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
          SQUARE_BACKEND_APP_ID: ${{ secrets.SQUARE_BACKEND_APP_ID }}
        run: |
          faltando=""
          if [ -z "$SQUARE_TOKEN" ]; then faltando="$faltando SQUARE_TOKEN"; fi
          if [ -z "$SQUARE_BACKEND_APP_ID" ]; then faltando="$faltando SQUARE_BACKEND_APP_ID"; fi

          if [ -n "$faltando" ]; then
            echo "::error title=Secrets ausentes::Faltando:$faltando"
            {
              echo "## Deploy nao executado"
              echo ""
              echo "Secrets ausentes:**$faltando**"
              echo ""
              echo "Configure em **Settings -> Secrets and variables -> Actions -> New repository secret**:"
              echo ""
              echo "| Secret | Onde encontrar |"
              echo "| --- | --- |"
              echo "| \`SQUARE_TOKEN\` | Dashboard da Square Cloud, configuracoes da conta, API token |"
              echo "| \`SQUARE_BACKEND_APP_ID\` | ID do app do backend na Square Cloud (aparece na URL do app) |"
              echo ""
              echo "Depois de criar, rode este workflow de novo em **Actions -> Deploy Backend -> Run workflow**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Secrets presentes."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # Build fora da Square Cloud: o servidor so precisa rodar `node dist/app.js`,
      # o que deixa o restart quase instantaneo.
      - name: Build
        working-directory: backend
        run: npm run build

      # O zip leva o dist ja compilado (restart rapido) e tambem src/tsconfig,
      # porque o START do squarecloud.app recompila no servidor.
      - name: Empacotar
        working-directory: backend
        run: |
          zip -r ../backend.zip \
            dist \
            src \
            package.json \
            package-lock.json \
            tsconfig.json \
            squarecloud.app \
            -x "*.map"

      # Confere o que vai subir. Se o dist/app.js nao estiver no zip, a Square
      # Cloud nao encontra o MAIN e a aplicacao nao inicia.
      - name: Conferir o pacote
        run: |
          echo "Tamanho: $(du -h backend.zip | cut -f1)"
          if unzip -l backend.zip | grep -q "dist/app.js"; then
            echo "dist/app.js presente no zip."
          else
            echo "::error::dist/app.js nao esta no zip — o MAIN do squarecloud.app nao seria encontrado."
            unzip -l backend.zip
            exit 1
          fi

      - name: Deploy na Square Cloud
        uses: squarecloudofc/github-action@v2
        with:
          command: commit --file backend.zip ${{ secrets.SQUARE_BACKEND_APP_ID }} --restart
          token: ${{ secrets.SQUARE_TOKEN }}

      - name: Resumo
        run: |
          {
            echo "## Backend enviado para a Square Cloud"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- A aplicacao foi reiniciada (\`--restart\`)."
            echo ""
            echo "Confirme nos logs da Square Cloud a linha \`Soundscape API online\` com \`port: 80\`."
          } >> "$GITHUB_STEP_SUMMARY"
