name: Deploy Backend (Square Cloud)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build e commit na Square Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # Build fora da Square Cloud: o servidor so precisa rodar `node dist/app.js`,
      # o que deixa o restart quase instantaneo.
      - name: Build
        working-directory: backend
        run: npm run build

      # O zip leva o dist ja compilado (restart rapido) e tambem src/tsconfig,
      # porque o START do squarecloud.app recompila no servidor.
      - name: Empacotar
        working-directory: backend
        run: |
          zip -r ../backend.zip \
            dist \
            src \
            package.json \
            package-lock.json \
            tsconfig.json \
            squarecloud.app \
            -x "*.map"

      - name: Deploy na Square Cloud
        uses: squarecloudofc/github-action@v2
        with:
          command: commit --file backend.zip ${{ secrets.SQUARE_BACKEND_APP_ID }} --restart
          token: ${{ secrets.SQUARE_TOKEN }}

      - name: Resumo
        run: echo "Backend enviado para a Square Cloud (app ${{ secrets.SQUARE_BACKEND_APP_ID }})." >> $GITHUB_STEP_SUMMARY
